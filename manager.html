<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مدير القسم</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/theme.css">

    <link rel="stylesheet"
          href="css/animations.css">

    <link rel="stylesheet"
          href="css/manager.css">

</head>

<body>

<div class="dashboard">

    <header class="header">

        <div class="header-right">

            <img src="assets/logo.png"
                 class="logo">

            <div>

                <h2>

                    لوحة مدير القسم

                </h2>

                <span id="managerName">

                    مدير القسم

                </span>

                <small id="departmentName">

                    القسم

                </small>

            </div>

        </div>

        <div class="header-left">

            <div id="currentTime"></div>

            <div id="currentDate"></div>

            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

        </div>

    </header>

    <section class="menu">

        <button
            class="menu-card active"
            data-page="dashboard">

            <i class="fa-solid fa-chart-pie"></i>

            <span>

                لوحة القسم

            </span>

        </button>

        <button
            class="menu-card"
            data-page="employees">

            <i class="fa-solid fa-users"></i>

            <span>

                الموظفون

            </span>

        </button>

        <button
            class="menu-card"
            data-page="reports">

            <i class="fa-solid fa-file-pdf"></i>

            <span>

                التقارير

            </span>

        </button>

    </section>

    <main id="content">

    </main>

    <div class="pdf-modal" id="pdfModal" aria-hidden="true">

        <div class="pdf-modal-card">

            <div class="pdf-modal-header">
                <div>
                    <strong id="pdfModalTitle">عرض التقرير</strong>
                    <span>التقرير الأسبوعي</span>
                </div>
                <button type="button" class="pdf-close" id="pdfClose" aria-label="إغلاق">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <iframe id="pdfFrame" title="عرض التقرير" src="about:blank"></iframe>

        </div>

    </div>

</div>

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/manager.js"></script>

</body>

</html>
