<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/theme.css">

    <link rel="stylesheet"
          href="css/animations.css">

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body>

<div class="dashboard">

    <!-- Header -->

    <header class="header">

        <div class="header-right">

            <img src="assets/logo.png"
                 class="logo"
                 alt="Logo">

            <div>

                <h2>

                    نظام التقارير الأسبوعية

                </h2>

                <span>

                    لوحة الإدارة

                </span>

            </div>

        </div>

        <div class="header-left">

            <div id="currentTime">

                00:00

            </div>

            <div id="currentDate">

                00/00/0000

            </div>

            <button id="themeBtn">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

        </div>

    </header>

  <!-- Menu -->

<section class="menu">

    <button
        class="menu-card active"
        data-page="dashboard">

        <i class="fa-solid fa-chart-pie"></i>

        <span>

            لوحة التحكم

        </span>

    </button>

    <button
        class="menu-card"
        data-page="reports">

        <i class="fa-solid fa-file-pdf"></i>

        <span>

            التقارير

        </span>

    </button>

    <button
        class="menu-card"
        data-page="employees">

        <i class="fa-solid fa-users"></i>

        <span>

            الموظفون

        </span>

    </button>

    <button
        class="menu-card"
        data-page="settings">

        <i class="fa-solid fa-gear"></i>

        <span>

            الإعدادات

        </span>

    </button>

</section>

    <!-- Content -->

    <main
        id="content">

    </main>

</div>

<script src="js/config.js"></script>

<script src="js/storage.js"></script>

<script src="js/api.js"></script>
    
<script src="js/admin.js"></script>

<div class="pdf-modal" id="pdfModal" aria-hidden="true">

    <div class="pdf-modal-card">

        <div class="pdf-modal-header">

            <div>
                <strong id="pdfModalTitle">عرض التقرير</strong>
                <span>التقرير الأسبوعي</span>
            </div>

            <button type="button" class="pdf-close" id="pdfClose" aria-label="إغلاق">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <iframe id="pdfFrame" title="عرض التقرير" src="about:blank"></iframe>

    </div>

</div>

<div class="modal" id="employeeModal">

    <div class="modal-card">

        <h2 class="modal-title">

            إضافة موظف

        </h2>

        <div class="form-grid">

            <div class="form-group full">

                <label>

                    اسم الموظف

                </label>

                <input
                    id="empName"
                    type="text">

            </div>

            <div class="form-group">

                <label>

                    القسم

                </label>

                <select id="empDepartment">

                    <option>الإدارية</option>

                    <option>العلمية</option>

                    <option>الإعلام</option>

                    <option>قسم الدعوة</option>
                    
                    <option>الجاليات</option>

                    <option>القسم الإنساني</option>

                    <option>مركز غيم</option>
                </select>

            </div>

            <div class="form-group">

                <label>

                    الصلاحية

                </label>

                <select id="empRole">

    <option value="employee">

        موظف

    </option>

    <option value="manager">

        مدير قسم

    </option>

    <option value="admin">

        مدير عام

    </option>

</select>

            </div>

            <div class="form-group">

                <label>

                    اسم المستخدم

                </label>

                <input
                    id="empUsername"
                    type="text">

            </div>

            <div class="form-group">

                <label>

                    كلمة المرور

                </label>

                <input
                    id="empPassword"
                    type="password">

            </div>

        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                id="closeModal">

                إلغاء

            </button>

            <button
                class="save-btn"
                id="saveEmployee">

                حفظ الموظف

            </button>

        </div>

    </div>

</div> 
</body>

</html>
