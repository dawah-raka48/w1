<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام إدارة التقارير الأسبوعية</title>
<meta name="theme-color" content="#102b75"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="التقارير الأسبوعية">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="css/login-v6.css?v=1"><link rel="stylesheet" href="css/dialogs.css?v=1"><link rel="stylesheet" href="css/pwa.css?v=3">
<style>
#introSplash{position:fixed;inset:0;z-index:99999;background:#fff;display:grid;place-items:center;overflow:hidden;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}
#introSplash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
#introSplash video{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
#introSplash .intro-fallback{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:-1}
#introSplash .intro-fallback img{width:min(28vw,180px);height:auto;opacity:.92}
@media (max-width:600px){#introSplash video{object-fit:contain}#introSplash .intro-fallback img{width:42vw;max-width:150px}}
@media (prefers-reduced-motion:reduce){#introSplash{transition:none}}
</style>
</head>
<body>
<div id="introSplash" aria-label="مقدمة نظام إدارة التقارير" aria-hidden="false">
    <div class="intro-fallback"><img src="assets/logo.png" alt=""></div>
    <video id="introVideo" autoplay muted playsinline preload="auto" poster="assets/logo.png">
        <source src="assets/    intro.MP4" type="video/mp4">
    </video>
</div>
<div class="login-page">
<main class="login-card fade-up">
    <div class="card-logo"><img src="assets/logo.png" alt="شعار جمعية الراكه الدعوية"></div>
    <div class="login-kicker">جمعية الراكه الدعوية</div>
    <h1 class="login-title">مرحبًا بك</h1>
    <p class="login-subtitle">أدخل بياناتك للوصول إلى نظام إدارة التقارير</p>
    <form class="login-form">
        <div class="input-group"><i class="fa-solid fa-user"></i><input id="username" type="text" autocomplete="username" placeholder="اسم المستخدم"></div>
        <div class="input-group"><i class="fa-solid fa-lock"></i><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
        <label class="remember-row"><input type="checkbox"><span>تذكرني في هذا الجهاز</span></label>
        <button id="loginBtn" type="button" class="login-btn ripple"><span id="loginText">تسجيل الدخول</span><i class="fa-solid fa-right-to-bracket"></i></button>
    </form>
    <div class="contact-divider"><span>أو</span></div>
    <a class="developer-contact" href="https://wa.me/966580956015" target="_blank" rel="noopener noreferrer" aria-label="التواصل مع المطور عبر الواتساب">
        <span class="whatsapp-icon"><i class="fa-brands fa-whatsapp"></i></span>
        <span class="developer-contact-text"><strong>للتواصل مع المطور</strong><small>اضغط هنا للتواصل عبر الواتساب</small></span>
        <i class="fa-solid fa-chevron-left developer-arrow"></i>
    </a>
    <div class="security-note"><i class="fa-solid fa-lock"></i> بياناتك آمنة ومحمية</div>
    <div class="login-footer">Mohamed Shaaban Fathy Mohamed<br><span>2026</span></div>
</main>
</div>
<script>
(function(){
    const splash=document.getElementById('introSplash');
    const video=document.getElementById('introVideo');
    if(!splash||!video)return;
    let closed=false;
    const close=()=>{if(closed)return;closed=true;splash.classList.add('is-hidden');setTimeout(()=>splash.remove(),650)};
    const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){close();return;}
    video.addEventListener('ended',close,{once:true});
    video.addEventListener('error',()=>setTimeout(close,700),{once:true});
    setTimeout(close,12000);
    const play=video.play();
    if(play&&typeof play.catch==='function')play.catch(()=>setTimeout(close,1500));
})();
</script>
<script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/api.js?v=2"></script><script src="js/dialogs.js?v=1"></script><script src="js/auth.js?v=2"></script><script src="js/pwa.js?v=3"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=14').catch(()=>{}));</script>
</body></html>
