<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام إدارة التقارير الأسبوعية</title>
<meta name="theme-color" content="#102b75"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="التقارير الأسبوعية">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="css/login-modern.css?v=5"><link rel="stylesheet" href="css/dialogs.css?v=1"><link rel="stylesheet" href="css/pwa.css?v=3">
</head><body>
<div class="login-page">
<div class="top-badge"><i class="fa-solid fa-chart-line"></i> منصة إدارية ذكية</div>
<main class="login-card fade-up">
<div class="card-logo"><img src="assets/logo.png" alt="شعار جمعية الراكه الدعوية"></div>
<div class="login-kicker">جمعية الراكه الدعوية</div><h1 class="login-title">مرحبًا بك</h1><p class="login-subtitle">أدخل بياناتك للوصول إلى نظام إدارة التقارير</p>
<form class="login-form"><div class="input-group"><i class="fa-solid fa-user"></i><input id="username" type="text" autocomplete="username" placeholder="اسم المستخدم"></div><div class="input-group"><i class="fa-solid fa-lock"></i><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div><label class="remember-row"><input type="checkbox"><span>تذكرني في هذا الجهاز</span></label><button id="loginBtn" type="button" class="login-btn ripple"><span id="loginText">تسجيل الدخول</span><i class="fa-solid fa-right-to-bracket"></i></button></form>
<div class="forgot-link">نسيت كلمة المرور؟</div><div class="security-note"><i class="fa-solid fa-lock"></i> بياناتك آمنة ومحمية</div><div class="login-footer">جميع الحقوق محفوظة © 2025<br>جمعية الراكه الدعوية</div>
</main></div>
<script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/api.js"></script><script src="js/dialogs.js?v=1"></script><script src="js/auth.js?v=2"></script><script src="js/pwa.js?v=3"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=6').catch(()=>{}));</script>
</body></html>
