<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>نظام التقارير الأسبوعية</title>

    <meta name="theme-color"
          content="#4F46E5">

    <!-- Cairo Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/theme.css">

    <link rel="stylesheet"
          href="css/animations.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="login-wrapper">

    <div class="login-card fade-up">

        <!-- Logo -->

        <div class="logo float">

            <img src="assets/logo.png"
                 alt="Logo">

        </div>

        <!-- Title -->

        <h1 class="login-title">

            منصة رفع التقارير

        </h1>

        <p class="login-subtitle">

            جمعية الدعوة والإرشاد وتوعية الجاليات بالراكة

        </p>

        <!-- Login Form -->

        <form class="login-form">

            <div class="input-group">

                <i class="fa-solid fa-user"></i>

                <input
                    id="username"
                    type="text"
                    placeholder="اسم المستخدم">

            </div>

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    id="password"
                    type="password"
                    placeholder="كلمة المرور">

            </div>

            <button
                id="loginBtn"
                type="button"
                class="login-btn ripple">

                <span id="loginText">

                    تسجيل الدخول

                </span>

            </button>

        </form>

        <div class="login-footer">

            ✦ Designed & Developed by ✦
               Mohamed Shaaban Fathy

        </div>

    </div>

</div>

<script src="js/config.js"></script>

<script src="js/storage.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
